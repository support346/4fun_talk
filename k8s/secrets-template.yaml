# SECRETS TEMPLATE - DO NOT COMMIT ACTUAL VALUES
# These secrets are created/updated automatically by GitHub Actions CI/CD pipeline.
# To create manually (for first-time cluster setup), run:
#
#   kubectl create namespace verified-backend
#
#   kubectl create secret generic backend1-secrets \
#     --namespace=verified-backend \
#     --from-literal=MONGODB_URI="mongodb+srv://..." \
#     --from-literal=API_KEY="your-api-key" \
#     --from-literal=FIREBASE_SERVICE_ACCOUNT="$(base64 -w 0 path/to/firebase-adminsdk.json)"
#
#   kubectl create secret generic backend2-secrets \
#     --namespace=verified-backend \
#     --from-literal=ZEGO_APP_ID="your-zego-app-id" \
#     --from-literal=ZEGO_SERVER_SECRET="your-zego-server-secret"

# The FIREBASE_SERVICE_ACCOUNT value must be the base64-encoded content of the
# Firebase Admin SDK JSON file:
#   Linux/Mac: base64 -w 0 firebase-adminsdk.json
#   Windows:   [Convert]::ToBase64String([IO.File]::ReadAllBytes("firebase-adminsdk.json"))
