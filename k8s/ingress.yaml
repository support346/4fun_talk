apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: verified-backend-ingress
  namespace: verified-backend
  annotations:
    # Use nginx ingress controller (installed via DigitalOcean Marketplace or Helm)
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    # WebSocket upgrade headers for Socket.io (backend1)
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    # Sticky sessions for Socket.io (backend1 needs same pod per client)
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/affinity-mode: "persistent"
    nginx.ingress.kubernetes.io/session-cookie-name: "backend1-affinity"
    nginx.ingress.kubernetes.io/session-cookie-expires: "172800"
    # TLS (uncomment when cert-manager is installed)
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  # ingressClassName: nginx  # Alternative to annotation above for newer k8s
  rules:
    - http:
        paths:
          # Backend1: User Management (auth, profiles, socket.io)
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: backend1-service
                port:
                  number: 3003
          - path: /api/profile
            pathType: Prefix
            backend:
              service:
                name: backend1-service
                port:
                  number: 3003
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: backend1-service
                port:
                  number: 3003
          # Backend2: ZegoCloud Calls
          - path: /api/calls
            pathType: Prefix
            backend:
              service:
                name: backend2-service
                port:
                  number: 3000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: backend2-service
                port:
                  number: 3000
